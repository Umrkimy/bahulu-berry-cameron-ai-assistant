name: Security and quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_SUCCESS_URL: http://localhost:5173/payment/success
      STRIPE_CANCEL_URL: http://localhost:5173/payment/cancel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: uvx bandit -r app -q
        working-directory: backend
      - run: uv export --locked --no-dev --format requirements-txt | uvx pip-audit -r /dev/stdin
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
