name: Security and quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: stripe_test_key_ci_only
      STRIPE_WEBHOOK_SECRET: stripe_webhook_secret_ci_only
      STRIPE_SUCCESS_URL: http://localhost:5173/payment/success
      STRIPE_CANCEL_URL: http://localhost:5173/payment/cancel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: uvx bandit -r app -q
        working-directory: backend
      - run: uv export --locked --no-dev --format requirements-txt | uvx pip-audit -r /dev/stdin
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bahulu_test
          POSTGRES_USER: bahulu
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bahulu -d bahulu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://bahulu:ci-password@localhost:5432/bahulu_test
      TEST_DATABASE_URL: postgresql+asyncpg://bahulu:ci-password@localhost:5432/bahulu_test
      ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: stripe_test_key_ci_only
      STRIPE_WEBHOOK_SECRET: stripe_webhook_secret_ci_only
      STRIPE_SUCCESS_URL: http://localhost:5173/payment/success
      STRIPE_CANCEL_URL: http://localhost:5173/payment/cancel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
