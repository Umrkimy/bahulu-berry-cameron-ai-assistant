name: Security and quality checks

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: stripe_test_key_ci_only
      STRIPE_WEBHOOK_SECRET: stripe_webhook_secret_ci_only
      STRIPE_SUCCESS_URL: http://localhost:5173/payment/success
      STRIPE_CANCEL_URL: http://localhost:5173/payment/cancel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: uvx bandit -r app -q
        working-directory: backend
      - run: uv export --locked --no-dev --format requirements-txt | uvx pip-audit -r /dev/stdin
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
        working-directory: storefront
      - run: npm audit --omit=dev --audit-level=high
        working-directory: storefront
      - run: npm run lint -- --max-warnings=0
        working-directory: storefront
      - run: npm run build
        working-directory: storefront

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bahulu_test
          POSTGRES_USER: bahulu
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bahulu -d bahulu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://bahulu:ci-password@localhost:5432/bahulu_test
      TEST_DATABASE_URL: postgresql+asyncpg://bahulu:ci-password@localhost:5432/bahulu_test
      ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: stripe_test_key_ci_only
      STRIPE_WEBHOOK_SECRET: stripe_webhook_secret_ci_only
      STRIPE_SUCCESS_URL: http://localhost:5173/payment/success
      STRIPE_CANCEL_URL: http://localhost:5173/payment/cancel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyse code
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  trivy-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report repository vulnerabilities, secrets, and configuration issues
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-repository-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Block fixable Critical repository vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy repository report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-repository-report
          path: trivy-repository-report.json
          if-no-files-found: warn
          retention-days: 30

  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            image: bahulu-security-api:ci
          - name: frontend
            context: frontend
            image: bahulu-security-frontend:ci
          - name: storefront
            context: storefront
            image: bahulu-security-storefront:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.name }} image
        run: docker build --tag ${{ matrix.image }} ${{ matrix.context }}
      - name: Report ${{ matrix.name }} image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy-${{ matrix.name }}-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Block fixable Critical ${{ matrix.name }} image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload ${{ matrix.name }} Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.name }}-report
          path: trivy-${{ matrix.name }}-report.json
          if-no-files-found: warn
          retention-days: 30
