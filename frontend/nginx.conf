server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    # Send "Server: nginx" without the version number.
    server_tokens off;

    # Cloudflare sets CF-Connecting-IP to the visitor address and overwrites any
    # value a visitor sends. The API accepts X-Client-IP only when
    # TRUST_CLOUDFLARE_CLIENT_IP is enabled (production behind Cloudflare);
    # ordinary local Docker continues to
    # use the socket IP, where this header is empty.
    location = /api {
        proxy_pass http://api:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $http_cf_connecting_ip;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $http_cf_connecting_ip;
    }

    # Dashboard pages only; API responses carry their own security headers.
    # Mantine injects <style> elements, so styles need 'unsafe-inline'.
    # __API_ORIGIN__ is filled in by the Dockerfile when VITE_API_BASE_URL is an
    # absolute URL, and left empty for the proxied /api default.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
