server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        proxy_pass http://api:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # cloudflared supplies the visitor address in X-Forwarded-For.  The
        # API accepts this dedicated header only when its tunnel-only trust
        # setting is enabled; ordinary local Docker continues to use socket IP.
        proxy_set_header X-Client-IP $http_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $http_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
