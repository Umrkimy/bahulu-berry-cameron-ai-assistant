services:
  db:
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  migrate:
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_ORIGINS: ${STAGING_ALLOWED_ORIGINS:?Set STAGING_ALLOWED_ORIGINS in .env.staging}
      TRUSTED_HOSTS: ${STAGING_TRUSTED_HOSTS:?Set STAGING_TRUSTED_HOSTS in .env.staging}

  api:
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      ALLOWED_ORIGINS: ${STAGING_ALLOWED_ORIGINS:?Set STAGING_ALLOWED_ORIGINS in .env.staging}
      TRUSTED_HOSTS: ${STAGING_TRUSTED_HOSTS:?Set STAGING_TRUSTED_HOSTS in .env.staging}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?Set STRIPE_SUCCESS_URL in .env.staging}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?Set STRIPE_CANCEL_URL in .env.staging}
      WHATSAPP_META_INBOUND_ENABLED: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env.staging}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env.staging}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env.staging}
        VITE_STOREFRONT_BASE_URL: ${VITE_STOREFRONT_BASE_URL:?Set VITE_STOREFRONT_BASE_URL in .env.staging}
  storefront:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${STOREFRONT_API_BASE_URL:?Set STOREFRONT_API_BASE_URL in .env.staging}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${STOREFRONT_WHATSAPP_NUMBER:-}
        STOREFRONT_SERVER_API_BASE_URL: ${STOREFRONT_SERVER_API_BASE_URL:-http://api:8000/api}
  cloudflared:
    image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.demo}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
volumes:
  postgres_staging_data:
